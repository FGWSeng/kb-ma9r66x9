<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抖音收藏总目录</title>
<style>
:root{
 --bg:#f6f7f9; --card:#fff; --ink:#1a1d21; --sub:#6b7280; --line:#e5e7eb;
 --accent:#0f766e; --accent-soft:#ecfdf5; --tag:#f1f5f9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 64px}
header.top{padding:6px 2px 16px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:.4px}
.meta{color:var(--sub);font-size:14px}
.stats{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;
 padding:6px 12px;font-size:13px;cursor:pointer;color:var(--sub);transition:.15s;
 font-family:inherit;line-height:1.4}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
 display:flex;flex-direction:column;cursor:pointer;transition:.18s;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,24,40,.10);border-color:#d6dde5}
.thumb{aspect-ratio:16/10;background:#eef1f4 center/cover no-repeat;position:relative}
.thumb .cat{position:absolute;left:10px;top:10px;background:rgba(15,118,110,.94);color:#fff;
 font-size:12px;padding:3px 9px;border-radius:6px;letter-spacing:.3px}
.thumb .dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.72);color:#fff;
 font-size:12px;padding:2px 7px;border-radius:5px}
.cbody{padding:13px 15px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.card h3{margin:0;font-size:15.5px;line-height:1.45;font-weight:600;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.autor{font-size:12.5px;color:var(--sub)}
.one{font-size:13.5px;color:#374151;
 display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:auto;padding-top:4px;font-size:12.5px;color:var(--accent);font-weight:600}
.bar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;
 color:var(--accent);cursor:pointer;background:none;border:0;padding:6px 0;font-weight:600;font-family:inherit}
.back:hover{opacity:.75}
.pos{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hero{position:relative;height:380px;background:#101418;overflow:hidden;border-bottom:1px solid var(--line)}
.hero-bg{position:absolute;inset:-30px;background:center/cover no-repeat;
 filter:blur(26px) saturate(1.1);opacity:.5;transform:scale(1.12)}
.hero-fg{position:absolute;inset:0;background:center/contain no-repeat;z-index:1}
.dbody{padding:20px 22px 24px}
.dbody h2{margin:0 0 10px;font-size:20px;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.tags span{background:var(--tag);color:#475569;font-size:12.5px;padding:4px 10px;border-radius:7px}
.sec-t{font-size:14px;font-weight:700;color:var(--accent);margin:20px 0 8px;
 letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.sec-t::before{content:"";width:3px;height:14px;background:var(--accent);border-radius:2px}
.sec-t .cnt{font-weight:500;color:var(--sub);font-size:12px;letter-spacing:0}
.lead{font-size:15px;color:#242a31;margin:0}
ul.pts{margin:0;padding-left:0;list-style:none}
ul.pts li{position:relative;padding-left:20px;margin:8px 0;color:#242a31;font-size:15px}
ul.pts li::before{content:"";position:absolute;left:4px;top:9px;width:6px;height:6px;
 border-radius:50%;background:var(--accent);opacity:.55}
.kv{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:8px;
 padding:11px 14px;font-size:14px;color:#155e56}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:10px;
 font-size:14px;font-weight:600;text-decoration:none;border:1px solid transparent;cursor:pointer;
 font-family:inherit;line-height:1.4}
.btn.p{background:var(--accent);color:#fff}
.btn.s{background:#fff;color:var(--accent);border-color:var(--accent)}
.btn.g{background:#f3f4f6;color:#374151;border-color:var(--line)}
.transcript{margin-top:4px;max-height:62vh;overflow:auto;border:1px solid var(--line);
 border-radius:10px;padding:14px 16px;background:#fbfcfd}
.transcript p{margin:2px 0;font-size:14.5px;color:#242a31;line-height:1.7}
.transcript p .ts{color:#9aa3ad;font-size:12.5px;margin-right:8px;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--sub);padding:60px 0}
.srcline{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);
 font-size:12.5px;color:var(--sub);word-break:break-all;line-height:1.6}
.srcline span{color:#0f766e;user-select:all;-webkit-user-select:all}
.toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,16px);
 background:rgba(22,28,32,.94);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:9px;
 opacity:0;pointer-events:none;transition:.22s;z-index:99;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{margin-top:36px;text-align:center;color:#9aa3ad;font-size:12.5px;line-height:1.9}
@media (max-width:600px){
 .wrap{padding:14px 12px 48px} h1{font-size:20px}
 .grid{grid-template-columns:1fr;gap:12px}
 .hero{height:260px}
 .dbody{padding:16px 15px 20px} .dbody h2{font-size:17.5px}
 ul.pts li,.lead{font-size:14.5px}
 .transcript{max-height:none}
}

.search{width:100%;max-width:520px;margin:14px 0 4px;padding:11px 15px;border-radius:10px;
 border:1px solid var(--line);background:var(--card);font:15px/1.5 inherit;color:var(--ink);
 font-family:inherit;outline:none;transition:.15s}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.10)}
.day{margin:26px 0 10px;font-size:13.5px;font-weight:700;color:#334155;
 display:flex;align-items:center;gap:10px;letter-spacing:.4px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.day span{font-weight:500;color:var(--sub);font-size:12.5px;letter-spacing:0}
.hit{background:#fff7cc;border-radius:3px;padding:0 2px}
</style></head>

<script>window.__DATA__=[{"id": "7694929792852928955", "title": "10月开始准备28考研，可参考我的节奏。我相信很多同学和我当时一样，大三的专业课、实验、四六级、计算机等级考试、实习、期末考试都会占用了大量的时间，所以现在只能先把数学、408和英语稳定学习节奏，学校", "author": "安娜Anna", "category": "考研", "duration": "", "date": "2026-11-23", "url": "https://www.douyin.com/note/7694929792852928955", "one": "分享28计算机考研备考节奏，包括各阶段学习计划、时间管理及平衡学业与考研的建议。", "points": ["10月开始备考28计算机考研，建议优先稳定数学、408和英语的学习节奏。", "分阶段（6-8月强化、9-10月真题、11月-考前二刷+模拟卷）详细规划各科目的学习重点和资料推荐。", "提供平衡大三学业、四六级、计算机等级考试、实习等琐事与考研时间的策略。"], "keyinfo": "- 考研科目：数学一、408（数据结构、计算机组成原理、操作系统、计算机网络）、英语、政治；- 数学资料：880B组为主，C组选做；真题二刷建议频率3天1套→2天1套→3天2套；- 408资料：宇天专题/强化课程，王道现有内容查漏；真题优先，二刷价值高；- 英语资料：唐迟阅读方法课，唐静翻译课；作文每周写1-2篇；- 政治资料：主流老师课程+肖1000选择题，后期肖八、肖四；- 平衡建议：主线任务（数学、408、英语）优先，其他事务按考试日期临时安排；实习建议避开暑假强化和冲刺阶段", "transcript": [], "file": "E:\\DouyinKB\\vault\\10月开始准备28考研，可参考我的节奏。我相信很多同学和我当时一样，大三的专业课、实验、四六级、计算机等级考试、实习、期末考试都会占用了大量的时间，所以现在只能.md"}, {"id": "7622286423575627219", "title": "11408考研经验帖，希望对大家有所帮助。", "author": "At", "category": "考研", "duration": "", "date": "2026-11-23", "url": "https://www.douyin.com/note/7622286423575627219", "one": "分享考研408和数学的备考经验，强调重复和理解的重要性。", "points": ["408备考分为基础、强化、真题、模拟与回顾四个阶段，每个阶段有具体的学习方法和重点。", "数学备考从3月开始，基础阶段注重打牢框架和动手思考。", "备考核心思路是重复和理解，尤其是408科目，需要反复回顾和模拟。"], "keyinfo": "- 总分：391；- 各科成绩：政治78、英语72、数学137、408 104；- 408备考阶段：；- 基础阶段（3月-8月底）：过王道四本书和课后选择题，每天回顾。；- 强化阶段（8月底-9月底）：理解流程、动手模拟，能复述和画图。；- 真题阶段：严格限时模拟，重点巩固错题。；- 模拟阶段：做模拟卷练手感和心态。；- 错题与后期回顾：记录薄弱知识点，反复巩固。；- 数学备考：基础阶段打牢框架，注重动手和思考。", "transcript": [], "file": "E:\\DouyinKB\\vault\\11408考研经验帖，希望对大家有所帮助.md"}, {"id": "7710489525672730523", "title": "现408考研回报率最高的方法：没有之一", "author": "晓晓", "category": "考研", "duration": "", "date": "2026-11-23", "url": "https://www.douyin.com/note/7710489525672730523", "one": "晓晓分享了针对408计算机考研的高回报学习方法，涵盖时间规划、重点知识模块、答题技巧等。", "points": ["考研冲刺阶段应聚焦考点和真题，重点学习数据结构、算法和核心硬件知识。", "LeetCode高频题需熟练掌握，推荐“三遍刷题法”；硬件知识结合MOOC和Logisim软件学习。", "进程调度、PV操作、页面置换等算法需重点练习，并使用Python模拟加深理解。", "网络知识按OSI模型梳理，掌握TCP等协议，用XMind绘制思维导图。", "考试时先做选择题，再按“数据结构→操作系统→组成原理→计算机网络”顺序解答大题。"], "keyinfo": "- 近十年真题覆盖70%大题考点。；- 子网划分（CIDR）和IP首部校验和计算真题占比超60%。；- 选择题40题需控制在70分钟内完成。；- 大题高频题（如PV操作、Cache计算）需确保满分，算法题优先写出暴力解法。", "transcript": [], "file": "E:\\DouyinKB\\vault\\现408考研回报率最高的方法：没有之一.md"}, {"id": "7696482558461006821", "title": "积分表推导过程.", "author": "洛雅麟.", "category": "考研", "duration": "", "date": "2026-11-23", "url": "https://www.douyin.com/note/7696482558461006821", "one": "笔记详细介绍了高等数学中积分公式的推导过程，涵盖多种特殊结构的积分计算方法。", "points": ["推导了含根号、平方、分式等特殊结构的积分公式。", "使用了变量替换、分部积分、三角代换等方法进行推导。", "列出了不同类型积分的具体公式和推导步骤。"], "keyinfo": "- 部分积分推导需要满足特定条件，如 \\( t \\geq 0 \\)、\\( b > 0 \\) 等。；- 题目编号从16到28，涵盖了多种积分类型。", "transcript": [], "file": "E:\\DouyinKB\\vault\\积分表推导过程.md"}, {"id": "7706320092078155355", "title": "考研数学真题难度梯队｜按这个顺序刷。数一/数二真题难度分级整理好了，按梯度刷真题，真的很重要！", "author": "小浩学长燕山大学机械考研", "category": "考研", "duration": "", "date": "2026-11-23", "url": "https://www.douyin.com/note/7706320092078155355", "one": "本文介绍了考研数学真题按难度梯队的刷题顺序，建议按“友好档→中等常规档→高难度档→地狱档”的顺序进行，以科学备考。", "points": ["考研数学真题按难度分为地狱档、高难度档、中等常规档、友好档四类，需按梯度刷题。", "地狱档（如2016、2018、2020）用于后期模考测上限；高难度档（如2014、2022、2024）用于拔高训练；中等常规档（如2012、2013、2015）为主力刷题；友好档（如2017、2021）用于前期建立信心。", "刷题建议：基础一般者先从友好档→中档入手，避免一上来啃难题；冲刺阶段再拿地狱档限时模考检验水平。"], "keyinfo": "- 数二2016、2018年真题平均分最低。；- 2026年数二真题未明确列入难度梯队，但建议后期关注。", "transcript": [], "file": "E:\\DouyinKB\\vault\\考研数学真题难度梯队｜按这个顺序刷。数一数二真题难度分级整理好了，按梯度刷真题，真的很重要.md"}, {"id": "7667466726065520241", "title": "全国大学生数学建模竞赛，AI备赛攻略上。全国大学生数学建模竞赛，AI备赛攻略", "author": "数学建模接单", "category": "数学建模", "duration": "", "date": "2026-11-23", "url": "https://www.douyin.com/note/7667466726065520241", "one": "本文介绍了如何利用AI工具提升全国大学生数学建模竞赛的备赛效率，并规避使用AI的常见陷阱。", "points": ["2025年数模竞赛首次允许使用AI工具（大语言模型、生成式AI、代码辅助工具），但核心建模分析需团队独立完成。", "AI可用于选题分析、数据清洗、代码编写等环节，显著提升效率（如编程工作量压缩80%、论文写作时间砍半）。", "需规避AI的3个致命陷阱（AI幻觉、AI味太重），如验证AI引用的文献和数据，人工改写AI生成内容以避免“AI味”。"], "keyinfo": "- **AI使用规定**：官方允许使用AI辅助，但需标注、提交交互记录，违规取消评奖资格。；- **中山大学关彦辉博士观点**：“驾驭AI而不被AI驾驭”。；- **可复制指令示例**：；- 指令①：AI分析三道国赛真题（A/B/C）的难度和适合度，按新手友好度排序。；- 指令②：AI自动完成数据清洗（缺失值填补、异常值检测），并生成Python代码。；- 指令③：AI分段输出建模代码（如特征工程阶段），需分模块提问验证。；- **避坑方法**：；- 对AI引用的文献和数值结果需人工验证（如知网、Google Scholar）。；- AI生成内容需人工改写，加入调试细节以避免“AI味”。", "transcript": [], "file": "E:\\DouyinKB\\vault\\全国大学生数学建模竞赛，AI备赛攻略上。全国大学生数学建模竞赛，AI备赛攻略.md"}, {"id": "7675656452463217961", "title": "国赛论文纯靠AI生成？26项AI检测来了。很多队伍还没读懂26年数模国赛官方发布的这条致命规则：", "author": "小卢学长", "category": "数学建模", "duration": "", "date": "2026-11-23", "url": "https://www.douyin.com/note/7675656452463217961", "one": "2026年数模国赛引入26项AI检测规则，提醒参赛者需人工主导核心建模与分析，并使用AI自查表规避违规风险。", "points": ["2026年数模国赛推出26项AI检测规则，强调核心建模与分析必须由参赛队主导，AI产出内容需逐项人工审查核实。", "AI在生成论文、调代码、做图表时存在幻觉、虚假数据、逻辑断层等问题，可能导致参赛队伍被取消评奖资格。", "官方提供的【2026 国赛 AI 全自动自查表】可覆盖六大核心维度（合规、幻觉与数据真实性、建模逻辑与题意适配等），自动检测问题并输出整改方案。"], "keyinfo": "- 26项AI检测规则；- 核心建模与分析需人工主导；- AI自查表覆盖六大维度、26个子项；- 自查表需上传参赛论文、比赛题目、附件、自查表四个文件；- 摘要字数需在800-1000字；- 正文页数需在20-32页；- 全局格式需统一（标题层级编号连续等）", "transcript": [], "file": "E:\\DouyinKB\\vault\\国赛论文纯靠AI生成？26项AI检测来了。很多队伍还没读懂26年数模国赛官方发布的这条致命规则：.md"}, {"id": "7681556391445810486", "title": "数模国赛Matplotlib出图模板！。1、准备统一绘图样式文件，不要到处重复设置参数。终稿用面向对象绘图方式，禁用seaborn默认主题。", "author": "云顶数模", "category": "数学建模", "duration": "", "date": "2026-11-23", "url": "https://www.douyin.com/note/7681556391445810486", "one": "本文介绍了数模国赛Matplotlib出图模板的准备工作、绘图规范和常见问题处理方法。", "points": ["准备统一绘图样式文件，避免重复设置参数，使用面向对象绘图方式，禁用seaborn默认主题。", "输出PNG+PDF双格式，分辨率600dpi，解决中文乱码、负号显示异常问题。", "画图兼顾黑白打印效果，搭配线型+标记，柱状图不截断纵轴，地图带九段线。", "折线、柱状、散点、热力图、子图均有现成示例，数据读取外部文件，避免硬编码。", "出图避开常见bug，探索可用Plotly，论文正文只用Matplotlib。"], "keyinfo": "- 统一绘图样式文件存储在`plot_style.py`中，包含Nature风8色（`NATURE8`）和色盲友好备选色（`CB`）。；- 数据读取示例：`df=pd.read_csv(\"表格/表3_方法对比.csv\")`，与三线表同源。；- 常见问题处理：中文方框（`axes.unicode_minus = False`）、PDF中文消失（`pdf.fonttype=42`）、默认蓝橙颜色恢复（检查是否调用`sns.set()`）、轴标签被裁（`bbox_inches=\"tight\"`）、多图宽度不一致（统一`figsize`）、图内标题与文中重复（删除`ax.set_title`）。", "transcript": [], "file": "E:\\DouyinKB\\vault\\数模国赛Matplotlib出图模板！。1、准备统一绘图样式文件，不要到处重复设置参数。终稿用面向对象绘图方式，禁用seaborn默认主题.md"}, {"id": "7682620657389030702", "title": "数模国赛模型差不多，为啥别人能拿国奖?。很多队伍算法模型差距不大，但最终获奖等级相差很远。国赛评分不只看模型复杂度，论文完整严谨的逻辑证据链尤为重要。", "author": "云顶数模", "category": "数学建模", "duration": "", "date": "2026-11-23", "url": "https://www.douyin.com/note/7682620657389030702", "one": "数学建模国赛获奖的关键在于论文的逻辑严谨性和对题目的深入理解，而非模型复杂度。", "points": ["国赛评分不只看模型复杂度，论文的完整严谨逻辑证据链尤为重要。", "摘要应写清任务、方法、结果及验证情况，避免只罗列模型。", "问题分析要从题目出发推导模型选择，避免盲目套用算法。", "模型假设需说明简化原因和影响，前后不能矛盾，复杂算法不等于高分。", "结果需配套检验和敏感性分析来证明可信，创新来源于结合赛题做调整。", "交卷前务必自查并遵守AI使用申报规范。"], "keyinfo": "国赛评分四大维度：假设的合理性、建模的创造性、结果的正确性、文字表述的清晰程度。；评委看论文确认的四件事：是否读懂题目、模型选择理由、结果可信度、论文清晰度。；高分摘要写法：写清任务、方法、结果及验证方式。；合格的模型假设需回答：简化原因、影响范围、假设不成立的结果变化。；创新需可解释、可验证，常见来源：自定义评价指标、增加现实约束、调整参数估算等。", "transcript": [], "file": "E:\\DouyinKB\\vault\\数模国赛模型差不多，为啥别人能拿国奖。很多队伍算法模型差距不大，但最终获奖等级相差很远。国赛评分不只看模型复杂度，论文完整严谨的逻辑证据链尤为重要.md"}, {"id": "7650153938188078345", "title": "408宇宙|一站式学习方案 408 四门课，每个知识点都做成了交互动画。2009-2026 共 846 道真题精讲 + 1583 道巩固题，错误选项标了出题陷阱。AI判题， 经典教材溯源", "author": "codebrick", "category": "认知", "duration": "6:34", "date": "2026-11-22", "url": "https://www.douyin.com/video/7650153938188078345", "one": "介绍408宇宙一站式学习网站的重大更新及其功能亮点。", "points": ["408宇宙网站新增经典教材溯源、1000+巩固题、大题评分系统和个人诊断系统。", "提供真题数据屏，帮助学生了解考点分布和命题规律。", "包含335篇长文笔记和210个交互式可视化，辅助学生理解知识点和算法。"], "keyinfo": "408宇宙提供一站式学习方案，涵盖408四门课，每个知识点都做成交互动画；包含2009-2026共846道真题精讲+1583道巩固题，错误选项标注出题陷阱；支持AI判题和经典教材溯源。", "transcript": ["京ICP备16016397号-3", "（京）人服证字〔2026〕第0600005023号", "网上有害信息举报", "充钻石", "客户端", "壁纸", "通知", "消息", "投稿", "00:00 / 00:00", "章节要点：共4个", "下一章", "智能", "清屏", "连播", "章节要点", "408宇宙一站式学习网站进行了重大更新，包括新增经典教材溯源、1000+巩固题、大题评分系统和个人诊断系统。网站还提供了真题数据屏，帮助学生更好地了解考点分布和命题规律。此外，还有335篇长文笔记和210个交互式可视化，帮助学生理解知识点和算法。"], "file": "E:\\DouyinKB\\vault\\408宇宙一站式学习方案 408 四门课，每个知识点都做成了交互动画。2009-2026 共 846 道真题精讲 + 1583 道巩固题，错误选项标了出题陷阱。.md"}, {"id": "7691234042503602875", "title": "可可乐乐｜视频主要展示了京ICP备16016397号-3和（京）人服证字〔2026〕第06000050", "author": "可可乐乐", "category": "认知", "duration": "5:37", "date": "2026-11-22", "url": "https://www.douyin.com/video/7691234042503602875", "one": "视频主要展示了京ICP备16 <script>
(function(){
  var DATA = window.__DATA__ || [];
  var TH = window.__TH__ || {};
  var BIG = window.__BIG__ || {};
  var app = document.getElementById("app");
  var cat = "全部", q = "", view = "list";

  function covUrl(map, id){
    return map[id] ? "url('" + map[id] + "')" : "none";
  }
  function hit(s, kw){
    if(!kw) return s;
    try{
      var re = new RegExp("(" + kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
      return s.replace(re, '<span class="hit">$1</span>');
    }catch(e){ return s; }
  }
  function match(d, kw){
    if(!kw) return true;
    var k = kw.toLowerCase();
    var hay = (d.title + " " + d.author + " " + d.category + " " + (d.one||"") + " " +
               (d.points||[]).join(" ")).toLowerCase();
    return hay.indexOf(k) >= 0;
  }

  function renderListCore(){
    var cats = ["全部"];
    for(var i=0;i<DATA.length;i++){ if(cats.indexOf(DATA[i].category)<0) cats.push(DATA[i].category); }
    var chips = cats.map(function(c){
      var n = c==="全部" ? DATA.length : DATA.filter(function(d){return d.category===c;}).length;
      return '<button class="chip'+(cat===c?' on':'')+'" data-act="cat" data-cat="'+c+'">'+c+' · '+n+'</button>';
    }).join("");
    var shown = DATA.filter(function(d){ return (cat==="全部"||d.category===cat) && match(d,q); });
    var html = "", lastDate = "", open = false;
    shown.forEach(function(d){
      if(d.date !== lastDate){
        if(open){ html += '</div>'; }
        var n = shown.filter(function(x){return x.date===d.date;}).length;
        html += '<div class="day">'+d.date+'<span>'+n+' 条</span></div><div class="grid">';
        lastDate = d.date; open = true;
      }
      var idx = DATA.indexOf(d);
      html += '<div class="card" data-act="open" data-idx="'+idx+'">'+
        '<div class="thumb" style="background-image:'+covUrl(TH, d.id)+'">'+
          '<div class="cat">'+d.category+'</div>'+
          (d.duration?'<div class="dur">'+d.duration+'</div>':'')+
        '</div>'+
        '<div class="cbody">'+
          '<h3>'+hit(d.title, q)+'</h3>'+
          '<div class="autor">'+hit(d.author, q)+'</div>'+
          '<div class="one">'+hit(d.one||"", q)+'</div>'+
          '<div class="more">查看总结 →</div>'+
        '</div></div>';
    });
    if(open){ html += '</div>'; }
    var days = DATA.reduce(function(a,d){ a[d.date]=1; return a; }, {});
    var dayCount = Object.keys(days).length;

    app.innerHTML =
      '<header class="top">'+
        '<h1>抖音收藏总目录</h1>'+
        '<div class="meta">共 '+DATA.length+' 条 · '+(cats.length-1)+' 个分类 · 横跨 '+dayCount+' 天'+
          ((q||cat!=="全部") ? '　·　当前显示 '+shown.length+' 条' : '')+'</div>'+
        '<input class="search" id="q" placeholder="搜索标题 / 作者 / 要点…" value="'+q.replace(/"/g,"&quot;")+'">'+
        '<div class="stats">'+chips+'</div>'+
      '</header>'+
      (shown.length ? html : '<div class="empty">没有匹配的条目</div>')+
      '<footer>由抖音收藏自动整理 · 共 '+DATA.length+' 条 · 点击卡片查看总结，再点进完整笔记</footer>';

    var box = document.getElementById("q");
    box.addEventListener("input", function(){
      q = box.value;
      renderListCore();
      window.scrollTo(0, 0);
      var b2 = document.getElementById("q");
      if(b2){ b2.focus(); b2.setSelectionRange(b2.value.length, b2.value.length); }

  }

  function renderDetail(idx){
    var d = DATA[idx];
    if(!d){ location.hash="#/"; return; }
    var kv = d.keyinfo ? '<div class="sec-t">关键信息</div><div class="kv">'+d.keyinfo+'</div>' : '';
    var pts = (d.points&&d.points.length) ? d.points.map(function(p){return '<li>'+p+'</li>';}).join("")

    app.innerHTML =
      '<div class="bar"><button class="back" data-act="home">← 返回总目录</button>'+
      '<span class="pos">第 '+(idx+1)+' / '+DATA.length+' 条 · '+d.date+'</span></div>'+
      '<article class="panel">'+
        '<div class="hero">'+
          '<div class="hero-bg" style="background-image:'+covUrl(BIG, d.id)+'"></div>'+

        '<div class="dbody">'+

        '</div>'+
      '</article>';
    window.scrollTo(0,0);
  }

  function renderNote(idx){
    var d = DATA[idx];
    if(!d){ location.hash="#/item/"+idx; return; }
    var pts = (d.points&&d.points.length)
      ? '<div class="sec-t">核心要点</div><ul class="pts">'+d.points.map(function(p){return '<li>'+p+'</li>';}).join("")+'</ul>'

    var trans = '';

      trans = '<div class="sec-t">完整文字稿 <span class="cnt">'+d.transcript.length+' 段</span></div>'+

        }).join("") +'</div>';

      '<div class="bar"><button class="back" data-act="detail" data-idx="'+idx+'">← 返回总结</button>'+
      '<span class="pos">完整笔记 · '+d.date+'</span></div>'+
      '<article class="panel"><div class="dbody">'+
        '<h2>'+d.title+'</h2>'+
        '<div class="tags"><span>'+d.category+'</span><span>'+d.author+'</span>'+
          (d.duration?'<span>'+d.duration+'</span>':'')+'</div>'+
        (d.one?'<div class="sec-t">一句话总结</div><p class="lead">'+d.one+'</p>':'')+
        pts+
        (d.keyinfo?'<div class="sec-t">关键信息</div><div class="kv">'+d.keyinfo+'</div>':'')+
        trans+

          (d.url?'<button class="btn s" data-act="video" data-url="'+d.url+'">观看原视频</button>'+

          '<button class="btn g" data-act="home">返回总目录</button>'+
        '</div>'+
      '</div></article>';
    window.scrollTo(0,0);
  }

  function toast(msg){
    var t = document.getElementById("toast");
    if(!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("on");
    clearTimeout(window.__tt); window.__tt = setTimeout(function(){ t.classList.remove("on"); },1800);
  }
  function copyText(s, tip){
    var m = tip || "链接已复制";
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(s).then(function(){toast(m);},
        function(){fbCopy(s, m);});
    } else { fbCopy(s, m); }
  }
  function fbCopy(s, tip){
    var m = tip || "链接已复制";
    var ta=document.createElement("textarea"); ta.value=s;
    ta.style.cssText="position:fixed;left:-9999px;top:0"; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(m); }
    catch(e){ toast("复制失败，请长按链接手动复制"); }
    document.body.removeChild(ta);
  }

  function route(){
    var h = location.hash || "";
    var mn = h.match(/^#\/note\/(\d+)/);
    var mi = h.match(/^#\/item\/(\d+)/);
    if(mn){ renderNote(parseInt(mn[1],10)); return; }
    if(mi){ renderDetail(parseInt(mi[1],10)); return; }
    renderListCore();
  }

  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]");
    if(!el) return;
    var act = el.getAttribute("data-act");
    if(act==="cat"){ e.preventDefault(); cat = el.getAttribute("data-cat"); renderListCore(); window.scrollTo(0,0); }
    else if(act==="open"){ location.hash = "#/item/"+el.getAttribute("data-idx"); }
    else if(act==="note"){ location.hash = "#/note/"+el.getAttribute("data-idx"); }
    else if(act==="detail"){ location.hash = "#/item/"+el.getAttribute("data-idx"); }
    else if(act==="home"){ location.hash = "#/"; }
    else if(act==="video"){
      e.preventDefault();
      var u = el.getAttribute("data-url")||""; if(!u) return;
      var w=null; try{ w = window.open(u,"_blank"); }catch(err){ w=null; }
      if(!w){ try{ location.href = u; }catch(e2){ copyText(u, "原视频链接已复制，去抖音打开"); } }
    }
    else if(act==="copy"){ e.preventDefault(); copyText(el.getAttribute("data-url")||"", "原视频链接已复制，去抖音打开"); }
    else if(act==="share"){
      e.preventDefault();
      var id = el.getAttribute("data-id")||"";
      if(!id) return;
      copyText(window.__SHARE__ + "n/" + id + ".html", "分享链接已复制，可直接发到群里");
    }
  });

  window.addEventListener("hashchange", route);
  if(!location.hash || location.hash==="#"){ history.replaceState(null,"","#/"); }
  route();
})();
</script>
</body></html>
